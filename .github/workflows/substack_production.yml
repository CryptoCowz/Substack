name: Substack Pasture Production Pipeline

on:
  schedule:
    # Mon-Thu at 8:00 AM EDT (12:00 UTC) -> Weekday CLEAR Herd Notes
    - cron: '0 12 * * 1-4'
    # Friday at 1:00 PM EDT (17:00 UTC) -> Weekly "What the Herd Learned" Digest
    - cron: '0 17 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Generation Mode'
        required: true
        default: 'daily_note'
        type: choice
        options:
          - 'daily_note'
          - 'character_short'
          - 'weekly_digest'
          - 'all'
      character_lane:
        description: 'Target Character Lane'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'mom_volatility'
          - 'dad_stablecoin'
          - 'blue_custody'
          - 'son_acceptance'

jobs:
  build-generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Diagnostic - Inspect Workspace Before Run
        run: |
          echo "=== 1. Root Directory Listing ==="
          ls -la
          echo "=================================="

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests google-genai google-api-python-client google-auth-httplib2 google-auth-oauthlib
          fi

      - name: Ensure Directories Exist
        run: |
          mkdir -p output/substack stills/portraits config scripts

      - name: Execute Pasture Content Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          LANE: ${{ github.event.inputs.character_lane || 'auto' }}
        run: |
          echo "=== 2. Running Content Generation Engine ==="
          if [ -f "scripts/generate_pasture_content.py" ]; then
            python scripts/generate_pasture_content.py --mode "$MODE" --lane "$LANE"
          elif [ -f "generate_pasture_content.py" ]; then
            python generate_pasture_content.py --mode "$MODE" --lane "$LANE"
          else
            echo "[!] Error: generate_pasture_content.py not found in root or scripts/."
            exit 1
          fi

      - name: Diagnostic - Inspect Output Directory
        run: |
          echo "=== 3. Inspecting Output Directory ==="
          if [ -d "output/substack" ]; then
            ls -la output/substack/
          else
            echo "[!] Warning: output/substack directory was not created."
          fi
          echo "=== 4. Git Status ==="
          git status
          echo "======================"

      - name: Upload Artifacts Bundle
        uses: actions/upload-artifact@v4
        with:
          name: substack-drafts-${{ github.run_number }}
          path: output/
          if-no-files-found: warn

      - name: Commit and Push Output to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest remote changes to avoid merge conflicts
          git pull origin main --rebase || true
          
          # Force add output/substack to bypass any .gitignore rules
          git add -f output/substack/
          
          if git diff --staged --quiet; then
            echo "[*] No new changes detected to commit."
          else
            git commit -m "Auto-generate Substack pasture drafts [$(date +'%Y-%m-%d')]"
            git push origin HEAD:main
          fi

      - name: Sync Output Directly to Google Drive
        if: env.GDRIVE_CREDENTIALS != ''
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > gdrive_credentials.json
          if [ -f "scripts/sync_to_gdrive.py" ]; then
            python scripts/sync_to_gdrive.py
          elif [ -f "sync_to_gdrive.py" ]; then
            python sync_to_gdrive.py
          fi
          rm -f gdrive_credentials.json
